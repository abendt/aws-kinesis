[versions]

java = "25"
kotlin = "2.4.21"
springBoot = "4.1.2"

slf4j = "2.0.20"
logback = "1.6.6"

junit = "6.1.3"
kotest = "6.2.7"
mockk = "1.14.12"

ktlint = "0.50.0"

gradleTestLoggerPlugin = "4.0.0"
gradleSpotlessPlugin = "8.11.0"

[libraries]

# Logging
kotlinLogging = "io.github.oshai:kotlin-logging-jvm:8.0.7"

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-jul = { module = "org.slf4j:jul-to-slf4j", version.ref = "slf4j" }
slf4j-jcl = { module = "org.slf4j:jcl-over-slf4j", version.ref = "slf4j" }

logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logback-core = { module = "ch.qos.logback:logback-core", version.ref = "logback" }

# Testing
junit-bom = { module = "org.junit:junit-bom", version.ref="junit" }

kotest-runner = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotest-json = { module = "io.kotest:kotest-assertions-json", version.ref = "kotest"}
kotest-spring = { module = "io.kotest:kotest-extensions-spring", version.ref = "kotest" }
kotest-testcontainers = { module = "io.kotest:kotest-extensions-testcontainers", version.ref = "kotest" }

mockk-core = { module = "io.mockk:mockk", version.ref = "mockk" }

[plugins]

spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }

[bundles]

kotest = ["kotest-runner", "kotest-assertions", "kotest-json", "kotest-property"]
logback = ["logback-classic", "logback-core"]
slf4j = ["slf4j-jul", "slf4j-jcl", "slf4j-api"]
